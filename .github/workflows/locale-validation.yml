name: Validate locale catalogs

on:
  pull_request:
    paths:
      - .github/workflows/locale-validation.yml
      - .github/i18n/**
      - translations/**
      - messages/**
      - src/**/*.js
      - src/**/*.jsx
      - src/**/*.ts
      - src/**/*.tsx
      - package.json
      - package-lock.json

permissions: {}

jobs:
  validate:
    uses: RedHatInsights/i18n-tooling/.github/workflows/i18n-validate.yml@7228d32f08872f97c8de8d255b5690e77f484f1f
    with:
      package-manager: npm
      validation-config: .github/i18n/catalog-validation.json
    permissions:
      contents: read
